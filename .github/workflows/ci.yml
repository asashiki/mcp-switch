name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Docker Compose
        run: |
          docker compose --env-file .env.example -f infra/docker/compose.yaml config --format json > /tmp/mcp-switch-compose.json
          jq -e '.services["mcp-switch"].environment.MCP_GATEWAY_HOST == "0.0.0.0"' /tmp/mcp-switch-compose.json
          jq -e '.services["mcp-switch"].environment.MCP_AUTH_DB_PATH == "/data/mcp-switch.sqlite"' /tmp/mcp-switch-compose.json
          docker compose -p mcp-switch-next --env-file .env.vps.example -f infra/docker/compose.yaml config --quiet
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify built Savepoint stdio server and export
        run: node --import tsx --test apps/mcp-gateway/src/savepoint/server.test.ts
        env:
          SAVEPOINT_TEST_CLI: ${{ github.workspace }}/apps/mcp-gateway/dist/cli/savepoint.js
