<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,sans-serif;color:var(--color-text-primary,#292936)}*{box-sizing:border-box}body{margin:0;background:transparent}.stage{position:relative;max-width:760px;min-height:220px;border-radius:18px;overflow:hidden;background:light-dark(#f3f1ed,#23252b)}.stage.has-art{height:420px}.background,.cg{position:absolute;width:100%;height:100%;object-fit:cover}.cg{object-fit:contain;background:light-dark(#eeece7,#191b20)}.portrait{position:absolute;right:4%;bottom:0;height:100%;max-width:78%;object-fit:contain;object-position:bottom}.caption{position:relative;padding:30px;max-width:78%;z-index:1}.has-art .caption{position:absolute;bottom:0;left:0;max-width:100%;width:100%;padding:45px 24px 24px;background:linear-gradient(transparent,rgba(10,16,28,.82));color:#fff}.scene{font-size:13px;opacity:.7;margin-bottom:28px}.name{font-size:20px;font-weight:650;margin-bottom:10px}.line{white-space:pre-wrap;line-height:1.65;font-size:16px;margin:0}.status{margin:10px 0 0;font-size:14px;line-height:1.5}button{border:0;border-radius:8px;padding:9px 14px;background:light-dark(#e4e0d9,#343944);color:inherit;cursor:pointer;margin-top:12px}button[hidden],img[hidden]{display:none}.collapsed .stage{min-height:0;height:auto}.collapsed .caption{position:relative;background:none;color:inherit;padding:16px}.collapsed img,.collapsed .line,.collapsed .scene{display:none}@media(max-width:450px){.stage.has-art{height:340px}.caption{padding:22px;max-width:100%}.portrait{right:0;max-width:100%}.line{font-size:15px}}@media(prefers-reduced-motion:no-preference){.portrait{transition:opacity .12s}}
</style><main><section class="stage" aria-label="角色场景"><img class="background" hidden alt=""><img class="portrait" hidden alt=""><img class="cg" hidden alt="场景插画"><div class="caption"><div class="scene"></div><div class="name">等待角色出现</div><p class="line"></p></div></section><p class="status" role="status"></p><button id="toggle" hidden>收起</button></main><!-- SCRIPT --></html>
